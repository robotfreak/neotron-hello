[package]
name = "neotron-hello"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Peter <peter@makerspace.local>"]
description = "Hello World fuer Neotron Pico"

[dependencies]
neotron-sdk = "0.2"
neotron-api = "0.2"

[profile.release]
opt-level = "z"
lto = true
debug = false
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
panic = "abort"
